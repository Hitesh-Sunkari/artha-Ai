# ============================================================================
# ArthaAI Production Docker Compose Stack
# Multi-container deployment for Oracle Cloud, GCP, or Self-Hosted VMs
# ============================================================================

name: arthaai-stack

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arthaai-backend
    restart: unless-stopped
    environment:
      - ARTHAAI_ENVIRONMENT=production
      - ARTHAAI_LIVE_TRADING_ENABLED=false
      - ARTHAAI_DATA_DIR=/app/data
      - ARTHAAI_LOG_LEVEL=INFO
      - ARTHAAI_API_HOST=0.0.0.0
      - ARTHAAI_API_PORT=8000
      - ARTHAAI_ALLOWED_ORIGINS=*
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:-GEMINI}
      - LLM_GEMINI_MODEL=${LLM_GEMINI_MODEL:-gemini-3.1-flash-lite}
      - LLM_OPENAI_MODEL=${LLM_OPENAI_MODEL:-gpt-4o-mini}
      - LLM_MAX_CALLS_PER_RUN=20
      - LLM_TIMEOUT_SECONDS=45
    volumes:
      - arthai-runs:/app/data/runs
      - arthai-blackboard:/app/data/blackboard
      - arthai-chroma:/app/data/chroma_db
      - arthai-parquet:/app/data/parquet
    networks:
      - arthai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 384M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arthaai-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arthai-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  arthai-net:
    driver: bridge

volumes:
  arthai-runs:
    driver: local
  arthai-blackboard:
    driver: local
  arthai-chroma:
    driver: local
  arthai-parquet:
    driver: local

