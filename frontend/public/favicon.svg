<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="artha-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="artha-p1" x1="0" y1="64" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00875A" />
      <stop offset="60%" stop-color="#00D09C" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>
    <linearGradient id="artha-p2" x1="32" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="artha-cross" x1="16" y1="40" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D09C" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="artha-ambient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00D09C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="artha-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#artha-bg)" stroke="#00D09C" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#artha-ambient)" />

  <!-- Left Pillar (Risk & Foundation Wing) -->
  <path d="M14 51L27.5 12C28.8 8.5 31.2 8 32 8V20L22.5 47L22.5 51H14Z" fill="url(#artha-p1)" />

  <!-- Right Pillar (Alpha & Outperformance Vector) -->
  <path d="M32 8C32.8 8 35.2 8.5 36.5 12L50 51H41.5L41.5 47L32 20V8Z" fill="url(#artha-p2)" />

  <!-- Kinetic Alpha Chevron (Neural Bridge) -->
  <path d="M19 38.5L32 26.5L45 38.5L40.8 43L32 34.5L23.2 43L19 38.5Z" fill="url(#artha-cross)" filter="url(#artha-glow)" />

  <!-- Quantum Core Spark -->
  <polygon points="32,9 34.5,12.5 32,16 29.5,12.5" fill="#FFFFFF" opacity="0.95" />
</svg>
