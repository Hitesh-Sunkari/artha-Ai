# ============================================================================
# ArthaAI Master Docker Compose Orchestration
# Services:
#   1. backend:        FastAPI + FastMCP + DuckDB + ChromaDB + CrewAI (Port 8000)
#   2. user-frontend:  React User Portal + Nginx Reverse Proxy (Port 5173)
#   3. admin-frontend: React Institutional Admin Portal + Nginx (Port 5174)
# Persistent Volumes:
#   Research runs, blackboard states, ChromaDB vectors, Parquet store, and
#   canonical benchmark results are preserved across container lifecycle.
# ============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arthaai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ARTHAAI_ENVIRONMENT=production
      - ARTHAAI_LIVE_TRADING_ENABLED=false
      - ARTHAAI_DATA_DIR=/app/data
      - ARTHAAI_LOG_LEVEL=${ARTHAAI_LOG_LEVEL:-INFO}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:-GEMINI}
      - LLM_GEMINI_MODEL=${LLM_GEMINI_MODEL:-gemini-3.1-flash-lite}
      - ARTHAAI_ALLOWED_ORIGINS=*
    volumes:
      - arthaai-data-runs:/app/data/runs
      - arthaai-data-blackboard:/app/data/blackboard
      - arthaai-data-chroma:/app/data/chroma_db
      - arthaai-data-parquet:/app/data/parquet
      - arthaai-experiments-results:/app/experiments/results
      - arthaai-experiments-datasets:/app/experiments/datasets
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - arthaai-network

  user-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arthaai-user-frontend
    restart: unless-stopped
    ports:
      - "${USER_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - arthaai-network

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: arthaai-admin-frontend
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - arthaai-network

networks:
  arthaai-network:
    name: arthaai-network
    driver: bridge

volumes:
  arthaai-data-runs:
    name: arthaai-data-runs
  arthaai-data-blackboard:
    name: arthaai-data-blackboard
  arthaai-data-chroma:
    name: arthaai-data-chroma
  arthaai-data-parquet:
    name: arthaai-data-parquet
  arthaai-experiments-results:
    name: arthaai-experiments-results
  arthaai-experiments-datasets:
    name: arthaai-experiments-datasets
